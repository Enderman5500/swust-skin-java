plugins {
    id 'net.neoforged.moddev' version '2.0.148'
    id 'java'
}

group = 'cn.edu.swust.mc'
version = project.mod_version

repositories {
    // Offline/prefetched dependencies used by restricted networks.
    maven { url = uri("${rootDir}/../target/local-maven") }
    // CreeperHost mirrors MinecraftForge and NeoForge artifacts where the official Maven is unreachable.
    maven { url = 'https://maven.creeperhost.net' }
    mavenCentral()
}

neoForge {
    version = project.neoforge_version
    runs {
        server {
            server()
        }
    }
}

def localAuthlib = file('../target/local-maven/com/mojang/authlib/6.0.54/authlib-6.0.54.jar')
def localFastutil = file('../target/local-maven/it/unimi/dsi/fastutil/8.5.18/fastutil-8.5.18.jar')

dependencies {
    implementation files('../core/target/minecraft-server-report-core-1.0.0.jar')
    if (localAuthlib.exists()) {
        compileOnly files(localAuthlib)
    }
    if (localFastutil.exists()) {
        compileOnly files(localFastutil)
    }
}

processResources {
    inputs.property 'version', project.mod_version
    inputs.property 'minecraft_range', project.minecraft_range
    inputs.property 'neoforge_range', project.neoforge_range
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            'mod_version': project.mod_version,
            'neoforge_loader_range': project.neoforge_loader_range,
            'neoforge_range': project.neoforge_range,
            'mc_range': project.minecraft_range
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_version.toInteger()
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    from { zipTree(file('../core/target/minecraft-server-report-core-1.0.0.jar')) }
}

base {
    archivesName = "minecraft-server-report-neoforge-${minecraft_family}"
}
