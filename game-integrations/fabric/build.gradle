plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java'
}

group = 'cn.edu.swust.mc'
version = project.mod_version

def intermediary = project.findProperty('intermediary_url') ?:
        'https://maven.creeperhost.net/net/fabricmc/intermediary/%1$s/intermediary-%1$s-v2.jar'

loom {
    intermediaryUrl = intermediary
}

repositories {
    maven { url = 'https://maven.creeperhost.net/' }
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation files("../core/target/minecraft-server-report-core-1.0.0.jar")
}

tasks.named('jar', Jar) {
    from { zipTree(file('../core/target/minecraft-server-report-core-1.0.0.jar')) }
}

processResources {
    inputs.property "version", project.mod_version
    inputs.property "minecraft_range", project.minecraft_range
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version, "minecraft_range": project.minecraft_range
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_version.toInteger()
    options.encoding = 'UTF-8'
}

base {
    archivesName = "minecraft-server-report-fabric-${minecraft_family}"
}
